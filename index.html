<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استودیوی برند</title>
<meta name="description" content="Brand Studio — editable Persian RTL social templates for multiple brands">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%23121546'/%3E%3Crect x='9' y='9' width='14' height='14' rx='3' fill='%23F15B29'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brandline">
      <span class="eyebrow">Brand Studio</span>
      <h1>استودیوی برند</h1>
    </div>
    <div class="topctl">
      <label class="brandpick"><span class="dot" id="brand-dot"></span><select id="brand-select" aria-label="برند"></select></label>
      <button class="btn ghost" id="new-brand">+ برند تازه</button>
      <span class="pill" id="save-state">در حال بارگذاری…</span>
      <button class="btn" id="toggle-guides" aria-pressed="true">راهنماها</button>
      <button class="btn primary" id="go-publish">ذخیره و انتشار</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="main"><p class="loading">در حال بارگذاری برندها…</p></main>
</div>
<div class="modal" id="modal" hidden><div class="box" id="modal-box"></div></div>
<div class="toast" id="toast" hidden></div>
<script src="js/vendor/html-to-image.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
